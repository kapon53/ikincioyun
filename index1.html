<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İrem 1</title>
<style>
body {
font-family: 'Segoe UI', sans-serif;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
background-color: #ffe6f2;
margin: 0;
overflow: hidden;
user-select: none;
-webkit-user-select: none;
-webkit-touch-callout: none;
touch-action: none;
}

#heart-wrapper {
position: relative;
display: flex;
justify-content: center;
align-items: center;
width: 250px;
height: 250px;
cursor: pointer;
transition: transform 0.1s linear;
}

.beating {
animation: heartbeat 1.2s infinite;
}

@keyframes heartbeat {
0% { transform: scale(1); }
10% { transform: scale(1.15); }
20% { transform: scale(1); }
30% { transform: scale(1.15); }
40% { transform: scale(1); }
100% { transform: scale(1); }
}

#heart-text {
position: absolute;
width: 140px;
text-align: center;
font-weight: bold;
color: #ff0000;
font-size: 16px;
pointer-events: none;
z-index: 10;
}

/* FİNAL YAZISI VE GÜM-GÜM ATMA ANİMASYONU */
#final-message {
position: absolute;
font-size: 2.2em;
color: #ff0000;
font-weight: bold;
opacity: 0;
transition: opacity 0.8s ease;
text-align: center;
z-index: 50;
pointer-events: none;
width: 90%;
padding: 0 10px;
box-sizing: border-box;
}

.text-beating {
animation: textHeartbeat 1.2s infinite;
}

@keyframes textHeartbeat {
0% { transform: scale(1); }
10% { transform: scale(1.12); }
20% { transform: scale(1); }
30% { transform: scale(1.12); }
40% { transform: scale(1); }
100% { transform: scale(1); }
}

#dialog-screen {
display: none;
flex-direction: column;
align-items: center;
justify-content: center;
position: absolute;
top: 0; left: 0;
width: 100%; height: 100%;
background-color: #ffe6f2;
z-index: 100;
padding: 20px;
box-sizing: border-box;
}

#dialog-text {
color: #ff0000;
text-align: center;
margin-bottom: 25px;
font-size: 24px;
font-weight: bold;
}

.dialog-btn {
background-color: #28a745;
color: white;
border: none;
padding: 15px 25px;
font-size: 18px;
border-radius: 10px;
cursor: pointer;
font-weight: bold;
transition: transform 0.1s;
margin: 8px;
box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}

.dialog-btn:active {
transform: scale(0.92);
}

#dialog-buttons {
display: flex;
flex-direction: column;
align-items: center;
}
</style>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

<div id="dialog-screen">
<div id="dialog-text"></div>
<div id="dialog-buttons"></div>
</div>

<div id="final-message">BENDE SENİ ÇOK SEVİYORUM AŞKIMMM İYİ Kİ VARSINN ❤️</div>

<div id="heart-wrapper" class="beating">
<svg viewBox="0 0 100 100" width="100%" height="100%">
<defs>
<linearGradient id="fill-gradient" x1="0%" y1="100%" x2="0%" y2="0%">
<stop id="fill-stop1" offset="0%" stop-color="#ff0000" />
<stop id="fill-stop2" offset="0%" stop-color="transparent" />
</linearGradient>
</defs>
<path d="M 50 90 C -30 40 10 -20 50 20 C 90 -20 130 40 50 90"
fill="url(#fill-gradient)" stroke="#ff0000" stroke-width="2"/>
</svg>
<div id="heart-text">Beni ne kadar seviyorsun? (Basılı Tut)</div>
</div>

<script>
const wrapper = document.getElementById('heart-wrapper');
const stop1 = document.getElementById('fill-stop1');
const stop2 = document.getElementById('fill-stop2');
const text = document.getElementById('heart-text');
const finalMsg = document.getElementById('final-message');

const dialogScreen = document.getElementById('dialog-screen');
const dialogText = document.getElementById('dialog-text');
const dialogButtons = document.getElementById('dialog-buttons');

let holdTimer;
let progress = 0;
let isFinished = false;
let isDialogActive = false;

function startFilling(e) {
if (isFinished || isDialogActive) return;

clearInterval(holdTimer);
wrapper.classList.remove('beating');

holdTimer = setInterval(() => {
let step = 0.3;
if (progress > 60) step = 0.12;
if (progress > 80) step = 0.05;
if (progress > 95) step = 0.015;

progress += step;

if (Math.random() < 0.25) {
confetti({
particleCount: 1,
angle: 90,
spread: 40,
origin: { x: 0.5, y: 0.65 },
colors: ['#ff0000', '#ff8080', '#ffffff'],
startVelocity: 15 + Math.random() * 15,
gravity: 0.8,
scalar: 0.5,
ticks: 45,
zIndex: -1
});
}

if (progress >= 100) {
progress = 100;
finishAnimation();
}
updateHeart();
}, 30);
}

function stopFilling() {
if (isFinished) return;
clearInterval(holdTimer);

if (isDialogActive) return;

if (progress > 5 && progress < 100) {
isDialogActive = true;
showDialog(1);
} else {
progress = 0;
updateHeart();
wrapper.classList.add('beating');
}
}

function showDialog(step) {
wrapper.style.display = 'none';
dialogScreen.style.display = 'flex';

if (step === 1) {
dialogText.innerHTML = "Ne yani bu kadar mı???? hiç sevmiyorsun yanii";
dialogButtons.innerHTML = <button class="dialog-btn" onclick="showDialog(2)"&gt;evet bu kadar seviyorum mlsf&lt;/button>;
}
else if (step === 2) {
dialogText.innerHTML = "OHAAAAAA";
dialogButtons.innerHTML = <button class="dialog-btn" onclick="showDialog(3)"&gt;özür dilerim 😞&lt;/button>;
}
else if (step === 3) {
dialogText.innerHTML = "ÖYLE OLSUN HIH";
dialogButtons.innerHTML = <button class="dialog-btn" onclick="showDialog(4)"&gt;Ya elim kaydı özür dilerimm🥺&lt;/button>;
}
else if (step === 4) {
dialogText.innerHTML = "HMMM";
dialogButtons.innerHTML = <button class="dialog-btn" onclick="showDialog(5)"&gt;Hıhı&lt;/button>;
}
else if (step === 5) {
dialogText.innerHTML = "O zaman tekrar göster😝";
dialogButtons.innerHTML = <button class="dialog-btn" onclick="showDialog(6)"&gt;🥹&lt;/button>;
}
else if (step === 6) {
dialogScreen.style.display = 'none';
wrapper.style.display = 'flex';
progress = 0;
updateHeart();
wrapper.classList.add('beating');

setTimeout(() => { isDialogActive = false; }, 100);
}
}

function updateHeart() {
stop1.setAttribute("offset", progress + "%");
stop2.setAttribute("offset", progress + "%");

let scaleValue = 1 + (progress / 100) * 1.5;
wrapper.style.transform = scale(${scaleValue});

if(progress > 50) {
text.style.color = "white";
} else {
text.style.color = "#ff0000";
}
}

function finishAnimation() {
isFinished = true;
clearInterval(holdTimer);

// Kalbi tamamen gizle ki üst üste binmesin
wrapper.style.display = 'none';

// Yazıyı göster ve kalp atışı gibi gümletmeye başla
finalMsg.style.opacity = 1;
finalMsg.classList.add('text-beating');

confetti({
particleCount: 250,
spread: 120,
origin: { y: 0.6 },
colors: ['#ff0000', '#ffffff', '#cc0000']
});
}

wrapper.addEventListener("pointerdown", startFilling);
window.addEventListener("pointerup", stopFilling);
window.addEventListener("pointercancel", stopFilling);
window.addEventListener("contextmenu", function(e) { e.preventDefault(); });

</script>
</body>
</html>
